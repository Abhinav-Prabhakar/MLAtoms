[project]
name = "mlatoms"
version = "0.1.0"
description = "The periodic table of machine learning — one file per algorithm, every variant included."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Abhinav Prabhakar" }]
dependencies = ["numpy>=2.0"]

[dependency-groups]
dev = [
    "markdown-it-py>=3.0",
    "matplotlib>=3.9",
    "mdit-py-plugins>=0.4",
    "pillow>=10.1",
    "pygments>=2.18",
    "pytest>=8.3",
    "ruff>=0.7",
    "scipy>=1.14",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"
src = []

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "NPY"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"templates/*" = ["F821"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
